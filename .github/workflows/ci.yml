name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER_TIMEOUT: 6
      HTTP_TIMEOUT: 1
      LEASE_SECONDS: 3
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up --build -d --wait
      - name: Lint
        run: make lint
      - name: Unit and PostgreSQL integration tests
        run: make test
      - name: HTTP end-to-end tests
        run: make e2e
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose --profile test --profile e2e down -v
