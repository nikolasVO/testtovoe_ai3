[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "generation-orchestrator"
version = "1.0.0"
description = "Crash-safe generation orchestration with an exactly-once token ledger"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.34.2", "asyncpg==0.30.0",
  "httpx==0.28.1", "pydantic==2.13.5", "pydantic-settings==2.14.1",
  "alembic==1.18.4", "SQLAlchemy==2.0.50", "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==6.1.1", "hypothesis==6.131.9", "ruff==0.11.8"]

[tool.setuptools.packages.find]
include = ["app*", "providers*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a dedicated PostgreSQL test database", "e2e: requires the four-worker HTTP stack", "chaos: terminates a real subprocess"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
